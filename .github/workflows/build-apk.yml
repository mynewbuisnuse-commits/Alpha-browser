name: Build Alpha Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore NuGet packages
        run: dotnet restore AlphaBrowser.Android.csproj

      - name: Build APK
        run: dotnet build AlphaBrowser.Android.csproj -f net8.0-android -c Release /p:AndroidPackageFormat=apk /p:AndroidSigningEnabled=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaBrowser-APK
          path: bin/Release/net8.0-android/*.apk
