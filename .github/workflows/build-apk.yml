name: Build Alpha Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore NuGet packages
        run: dotnet restore AlphaBrowser.Android/AlphaBrowser.Android.csproj

      - name: Build APK
        run: >
          dotnet build AlphaBrowser.Android/AlphaBrowser.Android.csproj
          -f net8.0-android
          -c Release
          --no-restore
          /p:AndroidPackageFormat=aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphaBrowser-APK
          path: AlphaBrowser.Android/bin/Release/net8.0-android/*.aab

      - name: Build APK (unsigned)
        run: >
          dotnet build AlphaBrowser.Android/AlphaBrowser.Android.csproj
          -f net8.0-android
          -c Release
          --no-restore
          /p:AndroidPackageFormat=apk
          /p:AndroidSigningEnabled=false

      - name: Upload APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: AlphaBrowser-APK-unsigned
          path: AlphaBrowser.Android/bin/Release/net8.0-android/*.apk
